global
    log stdout format raw local0
    stats socket /run/sub2api-rollout/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 10s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 10m
    timeout http-keep-alive 2m
    timeout queue 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend public
    bind :8080
    http-request del-header X-Sub2API-Process-Role
    http-request del-header X-Sub2API-Deployment-Slot
    http-request del-header X-Sub2API-Release-ID
    http-request del-header X-Sub2API-Deployment-Version
    http-request del-header X-Sub2API-Deployment-Digest
    http-request set-header X-Forwarded-Proto http

    acl api_path path_beg /v1/
    use_backend api_pool if api_path
    default_backend console_pool

backend api_pool
    balance random
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    default-server inter 2s fastinter 1s downinter 1s rise 3 fall 2 slowstart 5s
    server blue sub2api-blue:8080 weight 100 check resolvers docker init-addr last,libc,none
    server green sub2api-green:8080 weight 0 check resolvers docker init-addr last,libc,none

backend console_pool
    balance random
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    default-server inter 2s fastinter 1s downinter 1s rise 3 fall 2 slowstart 5s
    server blue sub2api-blue:8080 weight 100 check resolvers docker init-addr last,libc,none
    server green sub2api-green:8080 weight 0 check resolvers docker init-addr last,libc,none
